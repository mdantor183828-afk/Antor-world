<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Antor Quran — আন্তর কুরআন</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#121212;--surface:#181818;--surface2:#1f1f1f;--border:#2a2a2a;
  --accent:#2e7d52;--al:#3da06a;--adim:#1b4d3e;--abg:#0b1a14;
  --text:#e8e8e8;--muted:#888;--gold:#c9a84c;
  --sw:300px;--hh:64px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Inter','Noto Sans Bengali',sans-serif;overflow:hidden}
button{font-family:inherit}

/* HEADER */
header{position:fixed;top:0;left:0;right:0;height:var(--hh);background:#0e0e0e;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 1.25rem;gap:1rem;z-index:100}
.menu-btn{display:none;background:none;border:none;color:var(--text);font-size:1.4rem;cursor:pointer;padding:.4rem;border-radius:6px}
.menu-btn:hover{background:var(--surface2)}
.brand{display:flex;align-items:center;gap:.65rem;text-decoration:none}
.brand-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--accent),var(--adim));border-radius:8px;display:grid;place-items:center;font-family:'Amiri',serif;font-size:1.1rem;color:#fff}
.brand-name{font-size:1.1rem;font-weight:700;color:var(--text)}
.brand-sub{font-size:.7rem;color:var(--al);font-family:'Noto Sans Bengali',sans-serif;display:block;margin-top:-2px}
.hdr-r{margin-left:auto}
.ctr{font-size:.78rem;color:var(--muted);background:var(--surface2);padding:.3rem .65rem;border-radius:20px;border:1px solid var(--border)}

/* LAYOUT */
.layout{display:flex;height:100vh;padding-top:var(--hh)}

/* SIDEBAR */
.sidebar{width:var(--sw);flex-shrink:0;background:#0f0f0f;border-right:1px solid var(--border);display:flex;flex-direction:column;height:100%;overflow:hidden;transition:transform .3s ease}
.sb-search{padding:.85rem 1rem;border-bottom:1px solid var(--border);flex-shrink:0}
.sb-search input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:.55rem .85rem;color:var(--text);font-size:.85rem;font-family:inherit;outline:none}
.sb-search input:focus{border-color:var(--accent)}
.sb-search input::placeholder{color:var(--muted)}
.slist{flex:1;overflow-y:auto;padding:.4rem 0}
.slist::-webkit-scrollbar{width:4px}
.slist::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

.si{display:flex;align-items:center;gap:.75rem;padding:.65rem 1rem;cursor:pointer;border-left:3px solid transparent;transition:background .15s}
.si:hover{background:var(--surface2)}
.si.active{background:var(--abg);border-left-color:var(--al)}
.snum{width:32px;height:32px;border:1px solid var(--border);border-radius:6px;display:grid;place-items:center;font-size:.72rem;font-weight:600;color:var(--muted);flex-shrink:0;background:var(--surface)}
.si.active .snum{background:var(--adim);border-color:var(--accent);color:var(--al)}
.sinfo{flex:1;min-width:0}
.sen{font-size:.875rem;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.smeta{font-size:.72rem;color:var(--muted);margin-top:1px}
.sar{font-family:'Amiri',serif;font-size:1rem;color:var(--gold);flex-shrink:0}

/* SKELETON */
.sk{background:linear-gradient(90deg,var(--surface) 25%,var(--surface2) 50%,var(--surface) 75%);background-size:200% 100%;animation:shi 1.4s infinite;border-radius:6px}
@keyframes shi{from{background-position:200% 0}to{background-position:-200% 0}}
.ski{display:flex;align-items:center;gap:.75rem;padding:.65rem 1rem}
.sk-n{width:32px;height:32px;flex-shrink:0}
.sk-i{flex:1;display:flex;flex-direction:column;gap:6px}
.sk-l{height:10px}

/* MAIN */
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.main::-webkit-scrollbar{width:6px}
.main::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

/* SURAH BANNER */
.banner{background:linear-gradient(160deg,#0d1f16,#0b1a10);border-bottom:1px solid var(--adim);padding:2rem 2rem 1.5rem;text-align:center;flex-shrink:0}
.ban-ar{font-family:'Amiri',serif;font-size:2.2rem;color:var(--gold);margin-bottom:.4rem;line-height:1.3}
.ban-en{font-size:1.1rem;font-weight:600;color:var(--text)}
.ban-meta{font-size:.8rem;color:var(--muted);display:flex;justify-content:center;gap:.6rem;margin-top:.6rem;flex-wrap:wrap}
.ban-meta span{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:.2rem .65rem}

/* BISMILLAH */
.bism{text-align:center;font-family:'Amiri',serif;font-size:1.8rem;color:var(--gold);padding:1.25rem 1rem .5rem;opacity:.9}

/* AYAH CARDS */
.ac-wrap{padding:1rem 1.5rem 2rem;display:flex;flex-direction:column;gap:1rem}
.ac{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;animation:fu .25s ease-out}
@keyframes fu{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* Arabic row */
.ar-wrap {
  padding: 1.25rem;
  direction: rtl;
  text-align: right;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  gap: 1rem;
}
.ar-txt{font-family:'Amiri',serif;font-size:28px;line-height:2;color:#f0ead6;flex:1}
.an-badge {
  min-width: 36px;
  height: 36px;
  border: 2px solid var(--accent);
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: .75rem;
  font-weight: 700;
  color: var(--al);
  flex-shrink: 0;
  background: var(--abg);
  direction: ltr;
}

/* Translation block */
.tr-wrap{background:var(--abg);border-left:4px solid var(--adim);padding:.9rem 1.25rem;font-family:'Noto Sans Bengali','Inter',sans-serif;font-size:.88rem;line-height:1.85}
.tr-row{margin-bottom:.2rem}
.tr-lbl{font-weight:700;color:var(--al);font-size:.82rem;margin-right:4px}
.tr-txt{color:#c8d8cc}
.tr-div{border:none;border-top:1px solid #1f3d30;margin:.6rem 0;opacity:.5}

/* WELCOME */
.welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;gap:1rem}
.w-icon{font-family:'Amiri',serif;font-size:4rem;color:var(--gold);opacity:.6}
.welcome h2{font-size:1.4rem;font-weight:600;color:var(--muted)}
.welcome p{font-size:.875rem;color:#555;max-width:340px;font-family:'Noto Sans Bengali',sans-serif}

/* LOADING */
.ldwrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:3rem}
.spin{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--al);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ldtxt{font-size:.85rem;color:var(--muted);font-family:'Noto Sans Bengali',sans-serif}

/* ERROR */
.erw{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.75rem;padding:2rem;text-align:center}
.erw .ei{font-size:2.5rem}
.erw p{font-size:.875rem;color:var(--muted);max-width:360px;font-family:'Noto Sans Bengali',sans-serif;line-height:1.7}
.rbtn{margin-top:.5rem;background:var(--accent);border:none;color:#fff;padding:.55rem 1.25rem;border-radius:8px;font-size:.875rem;cursor:pointer}
.rbtn:hover{background:var(--al)}

.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:90}

@media(max-width:768px){
  .menu-btn{display:grid;place-items:center}
  .sidebar{position:fixed;top:var(--hh);left:0;bottom:0;z-index:95;transform:translateX(-100%);width:min(var(--sw),88vw)}
  .sidebar.open{transform:translateX(0)}
  .overlay.open{display:block}
  .ac-wrap{padding:.75rem .85rem 2rem}
  .banner{padding:1.5rem 1rem 1.25rem}
  .ban-ar{font-size:1.7rem}
  .ar-txt{font-size:24px}
  .tr-wrap{font-size:.84rem}
}
</style>
</head>
<body>

<header>
  <button class="menu-btn" id="menuBtn">☰</button>
  <a class="brand" href="#">
    <div class="brand-icon">ق</div>
    <div>
      <span class="brand-name">Antor Quran</span>
      <span class="brand-sub">আন্তর কুরআন</span>
    </div>
  </a>
  <div class="hdr-r">
    <span class="ctr" id="ctr">লোড হচ্ছে…</span>
  </div>
</header>

<div class="overlay" id="overlay"></div>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sb-search">
      <input type="search" id="srch" placeholder="সূরা খুঁজুন…" autocomplete="off"/>
    </div>
    <div class="slist" id="slist">
      <div id="skel"></div>
    </div>
  </aside>

  <main class="main" id="main">
    <div class="welcome">
      <div class="w-icon">﷽</div>
      <h2>একটি সূরা বেছে নিন</h2>
      <p>বাম পাশের তালিকা থেকে যেকোনো সূরায় ক্লিক করুন।</p>
    </div>
  </main>
</div>

<script>
"use strict";
const API="https://api.alquran.cloud/v1";
const $slist=document.getElementById("slist");
const $skel=document.getElementById("skel");
const $main=document.getElementById("main");
const $ctr=document.getElementById("ctr");
const $srch=document.getElementById("srch");
const $sb=document.getElementById("sidebar");
const $ov=document.getElementById("overlay");
const $mb=document.getElementById("menuBtn");

let all=[], active=null, retry=null;

// Toggle sidebar
$mb.addEventListener("click",()=>$sb.classList.contains("open")?cls():opn());
$ov.addEventListener("click",cls);
function opn(){$sb.classList.add("open");$ov.classList.add("open")}
function cls(){$sb.classList.remove("open");$ov.classList.remove("open")}

// Skeleton
function showSkel(){
  let h="";
  for(let i=0;i<20;i++) h+=`<div class="ski"><div class="sk sk-n"></div><div class="sk-i"><div class="sk sk-l" style="width:${50+Math.random()*40|0}%"></div><div class="sk sk-l" style="width:38%"></div></div></div>`;
  $skel.innerHTML=h;
}

// Load 114 surahs
async function loadList(){
  showSkel();
  try{
    const r=await fetch(`${API}/surah`);
    if(!r.ok) throw 0;
    const j=await r.json();
    if(j.code!==200) throw 0;
    all=j.data;
    $skel.innerHTML="";
    $ctr.textContent="১১৪টি সূরা";
    renderList(all);
  }catch{
    $skel.innerHTML=`<div style="padding:1rem;font-size:.82rem;color:#f77;text-align:center;font-family:'Noto Sans Bengali',sans-serif;line-height:1.8">তালিকা লোড হয়নি।<br><span style="cursor:pointer;color:#3da06a;text-decoration:underline" onclick="loadList()">আবার চেষ্টা করুন</span></div>`;
  }
}

function renderList(list){
  document.querySelectorAll(".si").forEach(e=>e.remove());
  list.forEach(s=>{
    const d=document.createElement("div");
    d.className="si"+(s.number===active?" active":"");
    d.dataset.n=s.number;
    d.innerHTML=`<div class="snum">${s.number}</div><div class="sinfo"><div class="sen">${s.englishName}</div><div class="smeta">${s.englishNameTranslation} &bull; ${s.numberOfAyahs} আয়াত</div></div><div class="sar">${s.name}</div>`;
    d.addEventListener("click",()=>{cls();loadSurah(s.number)});
    $slist.appendChild(d);
  });
}

$srch.addEventListener("input",()=>{
  const q=$srch.value.trim().toLowerCase();
  renderList(!q?all:all.filter(s=>s.englishName.toLowerCase().includes(q)||s.englishNameTranslation.toLowerCase().includes(q)||String(s.number).includes(q)));
});

function ld(msg){$main.innerHTML=`<div class="ldwrap"><div class="spin"></div><div class="ldtxt">${msg||"আয়াত লোড হচ্ছে…"}</div></div>`}
function err(msg,fn){
  retry=fn;
  $main.innerHTML=`<div class="erw"><div class="ei">⚠️</div><p>${msg}</p><button class="rbtn" id="rb">আবার চেষ্টা করুন</button></div>`;
  document.getElementById("rb").addEventListener("click",()=>retry&&retry());
}

function setActive(n){
  document.querySelectorAll(".si").forEach(e=>e.classList.toggle("active",+e.dataset.n===n));
  const a=$slist.querySelector(".si.active");
  if(a) a.scrollIntoView({block:"nearest",behavior:"smooth"});
}

function safe(s){return s?String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"):""}

function hasBism(t){
  return t && (t.trim().startsWith("بِسْمِ اللَّهِ الرَّحْمَٰনِ الرَّحِيمِ") || t.trim().startsWith("بِسْمِ اللهِ الرَّحْمٰনِ الرَّحِيْمِ"));
}

function stripBism(t){
  const bism1 = "بِسْمِ اللَّهِ الرَّحْمَٰনِ الرَّحِيمِ";
  const bism2 = "بِسْمِ اللهِ الرَّحْمٰনِ الرَّحِيْمِ";
  let s = t.trim();
  if (s.startsWith(bism1)) s = s.replace(bism1, "").trim();
  else if (s.startsWith(bism2)) s = s.replace(bism2, "").trim();
  return s === "" ? t : s;
}

// Load surah with 3 editions
async function loadSurah(num){
  active=num;
  setActive(num);
  ld();

  const url=`${API}/surah/${num}/editions/quran-uthmani,bn.bengali,bn.bengali-uccharon`;

  try{
    const r=await fetch(url);
    if(!r.ok) throw new Error("HTTP "+r.status);
    const j=await r.json();
    if(j.code!==200||!Array.isArray(j.data)||j.data.length<3) throw new Error("Bad response");

    const arabicEd = j.data.find(d=>d.edition&&d.edition.identifier==="quran-uthmani");
    const bnTranEd = j.data.find(d=>d.edition&&d.edition.identifier==="bn.bengali");
    const bnUcchEd = j.data.find(d=>d.edition&&d.edition.identifier==="bn.bengali-uccharon");

    if(!arabicEd) throw new Error("Arabic edition missing");

    const meta=all.find(s=>s.number===num)||{};
    renderSurah(num,meta,
      arabicEd.ayahs,
      bnTranEd?bnTranEd.ayahs:[],
      bnUcchEd?bnUcchEd.ayahs:[]
    );

  }catch(e){
    // Fallback URL if 3 editions bundle fails
    try{
      const r2=await fetch(`${API}/surah/${num}/editions/quran-uthmani,bn.bengali`);
      if(!r2.ok) throw 0;
      const j2=await r2.json();
      if(j2.code!==200||!Array.isArray(j2.data)) throw 0;
      const aEd=j2.data.find(d=>d.edition&&d.edition.identifier==="quran-uthmani")||j2.data[0];
      const bEd=j2.data.find(d=>d.edition&&d.edition.identifier==="bn.bengali")||j2.data[1];
      const meta=all.find(s=>s.number===num)||{};
      renderSurah(num,meta,aEd.ayahs,bEd?bEd.ayahs:[],[]);
    }catch{
      err("সূরাটি লোড হয়নি।<br>ইন্টারনেট সংযোগ পরীক্ষা করুন।",()=>loadSurah(num));
    }
  }
}

function renderSurah(num,meta,arabicAyahs,bnTranAyahs,bnUcchAyahs){
  const revBn=meta.revelationType==="Meccan"?"মক্কি":meta.revelationType==="Medinan"?"মাদানি":(meta.revelationType||"");
  const hasUcch=bnUcchAyahs&&bnUcchAyahs.length>0;

  let html=`
    <div class="banner">
      <div class="ban-ar">${safe(meta.name||"")}</div>
      <div class="ban-en">${safe(meta.englishName||"")}</div>
      <div class="ban-meta">
        <span>📖 ${safe(meta.englishNameTranslation||"")}</span>
        ${revBn?`<span>🕌 ${revBn}</span>`:""}
        <span>📿 ${meta.numberOfAyahs||arabicAyahs.length} আয়াত</span>
        <span>সূরা #${num}</span>
      </div>
    </div>`;

  if(num!==1&&num!==9){
    html+=`<div class="bism">بِسْمِ اللَّهِ الرَّحْمَٰনِ الرَّحِيمِ</div>`;
  }

  html+=`<div class="ac-wrap">`;

  arabicAyahs.forEach((ayah,i)=>{
    let ar=ayah.text||"";
    const bnT=(bnTranAyahs[i]&&bnTranAyahs[i].text)?bnTranAyahs[i].text:"";
    const bnU=(bnUcchAyahs[i]&&bnUcchAyahs[i].text)?bnUcchAyahs[i].text:"";
    const n=ayah.numberInSurah;

    if(i===0&&num!==1&&hasBism(ar)) ar=stripBism(ar);
    if(!ar.trim()) return;

    let tr="";
    if(hasUcch&&bnU){
      tr+=`<div class="tr-row"><span class="tr-lbl">উচ্চারণ:</span><span class="tr-txt">${safe(bnU)}</span></div>`;
      if(bnT) tr+=`<hr class="tr-div">`;
    }
    if(bnT){
      tr+=`<div class="tr-row"><span class="tr-lbl">অনুবাদ:</span><span class="tr-txt">${safe(bnT)}</span></div>`;
    }
    if(!tr) tr=`<div style="color:#555;font-size:.8rem">অনুবাদ পাওয়া যায়নি</div>`;

    html+=`
      <div class="ac">
        <div class="ar-wrap">
          <div class="ar-txt">${safe(ar)}</div>
          <div class="an-badge">${n}</div>
        </div>
        <div class="tr-wrap">${tr}</div>
      </div>`;
  });

  html+=`</div>`;
  $main.innerHTML=html;
  $main.scrollTo({top:0,behavior:"smooth"});
}

loadList();
</script>
</body>
</html>
